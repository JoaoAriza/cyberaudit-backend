# Perfil usado pelos testes que sobem o contexto do Spring.
#
# Objetivo: subir a aplicação inteira sem tocar em nada externo — sem Postgres,
# sem SMTP, sem Mercado Pago, sem rede. O que se quer exercitar é a cadeia de
# filtros; qualquer dependência de fora vira teste intermitente.

# H2 em memória no modo de compatibilidade com Postgres. O banco de verdade
# continua sendo Postgres — aqui só precisa existir schema para o contexto subir.
spring.datasource.url=jdbc:h2:mem:cyberaudit-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
# Precisa ser não-vazio: o StartupConfigCheck recusa o boot sem DB_PASSWORD, de
# propósito, para um deploy sem senha falhar em vez de subir com uma de exemplo.
# No H2 em memória a primeira conexão define as credenciais, então o valor é livre.
spring.datasource.password=teste
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 32 bytes: o mínimo que o JwtUtil exige para HMAC-SHA256. Valor fixo de teste,
# sem relação com qualquer segredo real.
jwt.secret=segredo-apenas-de-teste-32-bytes!!

# Origem única e previsível, para o teste afirmar sobre ela sem depender do
# default de desenvolvimento.
cors.allowed-origins=http://localhost:5173

# `auto` sonda a rede no boot para escolher o resolvedor. Em teste isso é
# latência e intermitência sem contrapartida.
dns.resolver=system

mail.enabled=false
mp.access-token=
