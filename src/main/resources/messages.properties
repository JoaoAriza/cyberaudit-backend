# Catálogo de mensagens dos achados de segurança — português (padrão e fallback).
#
# Por que existe: o texto de cada achado nascia embutido no ScoreService, em
# português. Vender fora do Brasil exige traduzir o LAUDO, não só a interface —
# cliente lendo tela em inglês e achado em português não compra. Todo achado já
# tinha ID estável, então o ID virou a chave.
#
# Formato: issue.<CHAVE>.title | .impact | .recommendation
#
# A CHAVE é o ID do achado, exceto onde o ID é montado em tempo de execução
# (CVE_2024_1234, JWT_HIGH, GRAPHQL_PLAYGROUND, API_DOCS_SWAGGER). Nesses casos a
# chave é a base estável — ver ScoreService.
#
# ATENÇÃO ao apóstrofo: mensagem COM parâmetro passa por MessageFormat, e ali `'`
# é escape — precisa ser dobrado (''). Mensagem SEM parâmetro é devolvida crua,
# e apóstrofo simples funciona. Por isso "Let's Encrypt" abaixo tem um só, e o
# JWT (que tem {0}) tem dois.
#
# Este arquivo é o fallback de qualquer idioma: spring.messages.fallback-to-system-locale=false
# garante que locale desconhecido caia aqui, e não no locale do servidor.

# ── SSL / TLS ────────────────────────────────────────────────────────────────
issue.NO_HTTPS_SUPPORT.title=HTTPS não suportado
issue.NO_HTTPS_SUPPORT.impact=Dados trafegam em plaintext — interceptação trivial.
issue.NO_HTTPS_SUPPORT.recommendation=Habilitar HTTPS com certificado válido (ex: Let's Encrypt).

issue.SSL_INVALID.title=Certificado SSL inválido
issue.SSL_INVALID.impact=Usuários recebem alerta de segurança; comunicação pode ser insegura.
issue.SSL_INVALID.recommendation=Renovar e configurar corretamente o certificado e a cadeia intermediária.

issue.SSL_EXPIRED.title=Certificado SSL expirado
issue.SSL_EXPIRED.impact=Browsers bloqueiam ou alertam o usuário.
issue.SSL_EXPIRED.recommendation=Renovar o certificado imediatamente.

issue.SSL_EXPIRING_SOON.title=Certificado próximo da expiração
issue.SSL_EXPIRING_SOON.impact=Restam {0} dia(s). Nesse ponto a renovação automática já deveria ter ocorrido — o mais provável é que ela esteja falhando.
issue.SSL_EXPIRING_SOON.recommendation=Verificar o certbot/ACME client e os logs de renovação.

issue.WEAK_TLS_PROTOCOL.title=Protocolo TLS deprecated: {0}
issue.WEAK_TLS_PROTOCOL.impact=TLS 1.0/1.1 são deprecated pelo RFC 8996 — vulneráveis a POODLE e BEAST.
issue.WEAK_TLS_PROTOCOL.recommendation=Desabilitar TLS 1.0 e 1.1 no servidor. Exigir mínimo TLS 1.2.

issue.HTTP_NOT_REDIRECTING.title=HTTP não redireciona para HTTPS
issue.HTTP_NOT_REDIRECTING.impact=Usuários que digitam http:// acessam sem criptografia.
issue.HTTP_NOT_REDIRECTING.recommendation=Configurar redirect 301 de HTTP para HTTPS e habilitar HSTS.

# ── Headers ──────────────────────────────────────────────────────────────────
issue.HEADERS_UNVERIFIED.title=Headers de segurança não verificados
issue.HEADERS_UNVERIFIED.impact=A página não respondeu, então nenhum header de segurança pôde ser avaliado. O resultado é parcial e não confirma a presença de proteções.
issue.HEADERS_UNVERIFIED.recommendation=Verifique se o site está acessível (DNS, firewall, disponibilidade) e refaça o scan.

issue.SERVER_VERSION_EXPOSED.title=Versão de software exposta em Server ou X-Powered-By
issue.SERVER_VERSION_EXPOSED.impact=Facilita fingerprinting e busca por CVEs conhecidos.
issue.SERVER_VERSION_EXPOSED.recommendation=Remover ou obscurecer os headers Server e X-Powered-By.

issue.HSTS_MISSING.title=Strict-Transport-Security ausente
issue.HSTS_MISSING.impact=Ataques downgrade para HTTP são possíveis.
issue.HSTS_MISSING.recommendation=Adicionar: Strict-Transport-Security: max-age=31536000; includeSubDomains

issue.HSTS_WEAK.title=Strict-Transport-Security fraco
issue.HSTS_WEAK.impact=Configuração incompleta reduz a proteção.
issue.HSTS_WEAK.recommendation=Garantir max-age >= 2592000 e considerar includeSubDomains.

issue.CONTENT_TYPE_MISSING.title=X-Content-Type-Options ausente
issue.CONTENT_TYPE_MISSING.impact=Pode permitir MIME sniffing.
issue.CONTENT_TYPE_MISSING.recommendation=Adicionar: X-Content-Type-Options: nosniff

issue.CSP_MISSING.title=Content-Security-Policy ausente
issue.CSP_MISSING.impact=Sem barreira contra injeção de scripts externos.
issue.CSP_MISSING.recommendation=Implementar CSP com default-src 'self' como base.

issue.CSP_WEAK.title=Content-Security-Policy fraca
issue.CSP_WEAK.impact=unsafe-inline ou unsafe-eval anulam a proteção contra XSS.
issue.CSP_WEAK.recommendation=Remover 'unsafe-inline' e 'unsafe-eval'. Usar nonces ou hashes.

issue.XFRAME_MISSING.title=X-Frame-Options ausente
issue.XFRAME_MISSING.impact=Site pode ser embutido em iframes — risco de clickjacking.
issue.XFRAME_MISSING.recommendation=Adicionar X-Frame-Options: DENY ou usar frame-ancestors no CSP.

issue.REFERRER_POLICY_MISSING.title=Referrer-Policy ausente
issue.REFERRER_POLICY_MISSING.impact=URLs internas podem vazar para sites externos via header Referer.
issue.REFERRER_POLICY_MISSING.recommendation=Adicionar: Referrer-Policy: strict-origin-when-cross-origin

issue.REFERRER_POLICY_WEAK.title=Referrer-Policy insegura
issue.REFERRER_POLICY_WEAK.impact=unsafe-url vaza URLs completas incluindo query strings.
issue.REFERRER_POLICY_WEAK.recommendation=Usar strict-origin-when-cross-origin ou no-referrer.

issue.PERMISSIONS_POLICY_MISSING.title=Permissions-Policy ausente
issue.PERMISSIONS_POLICY_MISSING.impact=Sem restrição de APIs de browser (câmera, microfone, geolocalização).
issue.PERMISSIONS_POLICY_MISSING.recommendation=Adicionar Permissions-Policy restringindo features não usadas.

# ── CORS ─────────────────────────────────────────────────────────────────────
issue.CORS_REFLECTION_WITH_CREDENTIALS.title=CORS reflete origin com credentials habilitado
issue.CORS_REFLECTION_WITH_CREDENTIALS.impact=Qualquer site faz requests autenticadas cross-origin em nome do usuário.
issue.CORS_REFLECTION_WITH_CREDENTIALS.recommendation=Allowlist estrita de origens. Nunca combinar reflection com ACAC: true.

issue.CORS_ORIGIN_REFLECTION.title=CORS reflete a Origin do request
issue.CORS_ORIGIN_REFLECTION.impact=Qualquer site acessa recursos como origem autorizada.
issue.CORS_ORIGIN_REFLECTION.recommendation=Usar allowlist estrita em vez de espelhar o header Origin.

issue.CORS_WILDCARD_CREDENTIALS.title=ACAO: * com ACAC: true — configuração inválida
issue.CORS_WILDCARD_CREDENTIALS.impact=Browsers rejeitam, mas indica CORS sem controle.
issue.CORS_WILDCARD_CREDENTIALS.recommendation=Usar origens explícitas. Nunca wildcard com credentials.

issue.CORS_NULL_ORIGIN.title=Aceita null origin
issue.CORS_NULL_ORIGIN.impact=Acesso via iframe sandboxado ou file:// — vetor de exfiltração.
issue.CORS_NULL_ORIGIN.recommendation=Não incluir 'null' na allowlist de origens.

# ── Cookies e injeção ────────────────────────────────────────────────────────
issue.INSECURE_COOKIES.title={0} cookie(s) com problemas de segurança
issue.INSECURE_COOKIES.impact=Sem Secure/HttpOnly/SameSite: facilita roubo de sessão via XSS ou redes inseguras.
issue.INSECURE_COOKIES.recommendation=Adicionar Secure, HttpOnly e SameSite=Lax em todos os cookies de sessão.

issue.DB_ERROR_LEAKAGE_SUSPECTED.title=Possível exposição de erro de banco
issue.DB_ERROR_LEAKAGE_SUSPECTED.impact=Mensagens de erro revelam estrutura do banco.
issue.DB_ERROR_LEAKAGE_SUSPECTED.recommendation=Retornar mensagens genéricas em produção. Logar erros só no servidor.

issue.REFLECTED_XSS_SUSPECTED.title=Suspeita de Reflected XSS
issue.REFLECTED_XSS_SUSPECTED.impact=Input parece refletido na página sem escape.
issue.REFLECTED_XSS_SUSPECTED.recommendation=Output encoding, validação de inputs e CSP restritiva.

# ── Exposição de conteúdo ────────────────────────────────────────────────────
issue.SENSITIVE_ROBOTS_PATHS.title={0} path(s) sensível(is) em robots.txt
issue.SENSITIVE_ROBOTS_PATHS.impact=robots.txt funciona como mapa da estrutura interna para atacantes.
issue.SENSITIVE_ROBOTS_PATHS.recommendation=Não usar robots.txt para esconder paths. Use autenticação adequada.

issue.SENSITIVE_FILE_EXPOSED.title=Arquivo sensível acessível: {0}
issue.SENSITIVE_FILE_EXPOSED.impact=Exposição direta de configuração ou credenciais.
issue.SENSITIVE_FILE_EXPOSED.recommendation=Remover acesso público imediatamente. Verificar se credenciais foram comprometidas.

issue.DIRECTORY_LISTING.title=Directory listing habilitado: {0}
issue.DIRECTORY_LISTING.impact=Exposição da estrutura de arquivos facilita reconhecimento e acesso a arquivos sensíveis.
issue.DIRECTORY_LISTING.recommendation=Desabilitar directory listing no servidor web (Options -Indexes no Apache, autoindex off no Nginx).

# O impacto vem do HttpMethodService (m.getRisk()), não daqui.
issue.DANGEROUS_HTTP_METHOD.title=Método HTTP perigoso habilitado: {0}
issue.DANGEROUS_HTTP_METHOD.recommendation=Desabilitar métodos HTTP não necessários no servidor web.

issue.SECURITY_TXT_MISSING.title=security.txt ausente (RFC 9116)
issue.SECURITY_TXT_MISSING.impact=Dificulta reporte responsável de vulnerabilidades.
issue.SECURITY_TXT_MISSING.recommendation=Criar /.well-known/security.txt com campo Contact.

issue.OPEN_REDIRECT.title=Open Redirect detectado
issue.OPEN_REDIRECT.impact=Atacantes podem usar seu domínio como intermediário em ataques de phishing.
issue.OPEN_REDIRECT.recommendation=Validar e sanitizar todos os parâmetros de redirect. Usar allowlist de destinos.

# ── DNS e borda ──────────────────────────────────────────────────────────────
# O impacto vem do DnsSecurityService (getSummary()), não daqui.
issue.DNS_EMAIL_SPOOFING.title=Risco de email spoofing: {0}
issue.DNS_EMAIL_SPOOFING.recommendation=Configure SPF com -all, DMARC com p=reject e DKIM em todos os seletores ativos.

issue.NO_WAF_DETECTED.title=Nenhum WAF (Web Application Firewall) detectado
issue.NO_WAF_DETECTED.impact=Sem WAF, ataques como SQLi, XSS e brute-force chegam direto ao servidor de aplicação.
issue.NO_WAF_DETECTED.recommendation=Considere adicionar Cloudflare, AWS WAF ou similar como camada de proteção.

# ── CVE ──────────────────────────────────────────────────────────────────────
# Chave base: o ID do achado é CVE_<id>. O impacto é a descrição do NVD, em inglês
# na origem — não passa por aqui e não há como traduzir.
issue.CVE.title=[Potencial] {0} — {1} (CVSS {2})
issue.CVE.recommendation=Confirme a versão exata de {0} antes de agir — a detecção parte da versão reportada no banner e pode ser falso positivo se o fornecedor/distro aplicou backport da correção sem mudar o número da versão. Se confirmada, atualize para uma versão não afetada.
issue.CVE.reference=\ Ref: {0}

# ── JWT ──────────────────────────────────────────────────────────────────────
# Chave base: o ID do achado é JWT_<severidade>. O impacto vem do JwtSecurityService.
# Apóstrofos dobrados porque o título tem parâmetro (MessageFormat).
issue.JWT.title=JWT inseguro em ''{0}'' (alg={1})
issue.JWT.recommendation=Usar algoritmo assimetrico (RS256/ES256), adicionar claims exp/iss/aud, nunca usar alg=none em producao.

# ── GraphQL ──────────────────────────────────────────────────────────────────
issue.GRAPHQL_PLAYGROUND.title=GraphQL playground publico em {0}{1}
issue.GRAPHQL_PLAYGROUND.impact=Interface GraphQL interativa acessivel sem autenticacao — permite explorar e executar queries na API.
issue.GRAPHQL_INTROSPECTION.title=GraphQL introspection habilitada em {0}{1}
issue.GRAPHQL_INTROSPECTION.impact=Introspection habilitada em producao — expoe schema completo: queries, mutations, tipos e campos.
# Recomendação é a mesma nos dois casos.
issue.GRAPHQL.recommendation=Desabilitar introspection em producao (ex: spring.graphql.schema.introspection.enabled=false). Restringir acesso ao playground a ambientes de desenvolvimento.
issue.GRAPHQL.typeCount=\ ({0} tipos no schema)

# ── Documentação de API ──────────────────────────────────────────────────────
# Chave base: o ID do achado é API_DOCS_<tipo>. O impacto vem do ApiDocsExposureService.
issue.API_DOCS.title=Documentacao de API exposta: {0}
issue.API_DOCS.recommendation=Restringir acesso a documentacao de API em producao via autenticacao ou remover os endpoints /swagger-ui, /api-docs, /openapi.json.
