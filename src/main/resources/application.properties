# Configurável para o container poder alinhar EXPOSE/HEALTHCHECK com a porta real.
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/cyberaudit}
spring.datasource.username=${DB_USERNAME:cyberaudit}
# Sem default de propósito: com `cyberaudit123` como fallback, um deploy que
# esquecesse DB_PASSWORD subiria feliz com senha pública de exemplo. Agora falha no boot.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Equipe da plataforma ──────────────────────────────────────────────────
# E-mails (separados por vírgula) que podem dispensar a prova de posse de domínio
# em scan ativo. Role.OWNER NÃO serve para isso: /auth/register é público e cria
# todo cadastro já como OWNER da própria conta.
# Vazio = ninguém tem privilégio cross-tenant (padrão seguro).
platform.staff-emails=${PLATFORM_STAFF_EMAILS:}

# ── Motor de scan — capacidade ────────────────────────────────────────────
# Teto global de scans simultâneos. Cada scan abre ~16 threads e dezenas de
# conexões de saída; sem teto, carga concorrente derruba a instância.
scan.max-concurrent=${SCAN_MAX_CONCURRENT:4}
# Quanto uma requisição espera na fila por um slot antes de receber 503.
scan.acquire-timeout-seconds=${SCAN_ACQUIRE_TIMEOUT:20}

# Atrás de proxy reverso (nginx/Let's Encrypt), getRemoteAddr() devolve o IP do
# proxy: TODO guest cai no mesmo balde de rate-limit e no mesmo dono de scan async.
# Em produção atrás de proxy CONFIÁVEL, defina FORWARD_HEADERS=framework.
# Mantenha "none" quando o app estiver exposto direto — X-Forwarded-For é forjável.
server.forward-headers-strategy=${FORWARD_HEADERS:none}

# Respostas de erro nunca expõem stack trace / detalhe interno ao cliente.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# NVD (correlação de CVE) — chave opcional: sobe o rate-limit de 5 → 50 req/30s.
# Registre em https://nvd.nist.gov/developers/request-an-api-key
nvd.api-key=${NVD_API_KEY:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false
# O indicador de e-mail tenta autenticar no SMTP e, sem MAIL_PASSWORD, derruba o
# health para DOWN → /actuator/health responde 503 e o load balancer tira a
# instância de rotação, mesmo com a API 100% saudável. E-mail é recurso opcional
# (mail.enabled); indisponibilidade dele não é indisponibilidade do serviço.
management.health.mail.enabled=false

jwt.secret=${JWT_SECRET}

# Segredo do HMAC do token de posse de domínio (/.well-known/cyberaudit.txt).
# Declarado aqui, e não só como default no @Value, para resolver igual em qualquer
# fonte de propriedade (.env, env var, secret manager) e ficar visível junto das
# demais configs. Vazio = cai no JWT_SECRET — e nesse caso ROTACIONAR O JWT
# INVALIDA todos os tokens de posse já publicados pelos clientes.
domain.verification-secret=${DOMAIN_VERIFICATION_SECRET:${JWT_SECRET}}
jwt.expiration-ms=86400000

# CORS — separar múltiplas origens por vírgula
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Mail — notificações de scan
# MAIL_ENABLED=false desativa completamente o envio sem remover config
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.enabled=${MAIL_ENABLED:false}
mail.from=${MAIL_FROM:noreply@cyberaudit.app}

# Feedback — caixa opcional da plataforma que recebe cópia de todo feedback (cross-tenant).
# Vazio = só notifica OWNER/ADMIN da conta do remetente.
feedback.notify.email=${FEEDBACK_NOTIFY_EMAIL:}

# ── Mercado Pago / Billing ────────────────────────────────────────────────
# MP_ACCESS_TOKEN: token de TESTE (sandbox) ou produção do painel do Mercado Pago.
# Vazio = pagamentos desativados (/billing/subscribe responde 503 claro).
mp.access-token=${MP_ACCESS_TOKEN:}
# Secret para validar a assinatura x-signature do webhook. Vazio = validação pulada (sandbox).
mp.webhook-secret=${MP_WEBHOOK_SECRET:}
# Base pública do app, usada no back_url do checkout MP.
app.base-url=${APP_BASE_URL:http://localhost:5173}
# Preços das assinaturas (mensal). Placeholders — ajuste livremente.
billing.currency=${BILLING_CURRENCY:BRL}
billing.pro.amount=${BILLING_PRO_AMOUNT:29.90}
billing.enterprise.amount=${BILLING_ENTERPRISE_AMOUNT:99.90}
