server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/cyberaudit}
spring.datasource.username=${DB_USERNAME:cyberaudit}
spring.datasource.password=${DB_PASSWORD:cyberaudit123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# CORS — separar múltiplas origens por vírgula
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Mail — notificações de scan
# MAIL_ENABLED=false desativa completamente o envio sem remover config
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.enabled=${MAIL_ENABLED:false}
mail.from=${MAIL_FROM:noreply@cyberaudit.app}

# Feedback — caixa opcional da plataforma que recebe cópia de todo feedback (cross-tenant).
# Vazio = só notifica OWNER/ADMIN da conta do remetente.
feedback.notify.email=${FEEDBACK_NOTIFY_EMAIL:}

# ── Mercado Pago / Billing ────────────────────────────────────────────────
# MP_ACCESS_TOKEN: token de TESTE (sandbox) ou produção do painel do Mercado Pago.
# Vazio = pagamentos desativados (/billing/subscribe responde 503 claro).
mp.access-token=${MP_ACCESS_TOKEN:}
# Secret para validar a assinatura x-signature do webhook. Vazio = validação pulada (sandbox).
mp.webhook-secret=${MP_WEBHOOK_SECRET:}
# Base pública do app, usada no back_url do checkout MP.
app.base-url=${APP_BASE_URL:http://localhost:5173}
# Preços das assinaturas (mensal). Placeholders — ajuste livremente.
billing.currency=${BILLING_CURRENCY:BRL}
billing.pro.amount=${BILLING_PRO_AMOUNT:29.90}
billing.enterprise.amount=${BILLING_ENTERPRISE_AMOUNT:99.90}
