server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/cyberaudit}
spring.datasource.username=${DB_USERNAME:cyberaudit}
spring.datasource.password=${DB_PASSWORD:cyberaudit123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# CORS — separar múltiplas origens por vírgula
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Mail — notificações de scan
# MAIL_ENABLED=false desativa completamente o envio sem remover config
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.enabled=${MAIL_ENABLED:false}
mail.from=${MAIL_FROM:noreply@cyberaudit.app}
