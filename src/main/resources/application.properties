server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/cyberaudit}
spring.datasource.username=${DB_USERNAME:cyberaudit}
spring.datasource.password=${DB_PASSWORD:cyberaudit123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# CORS — separar múltiplas origens por vírgula
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}