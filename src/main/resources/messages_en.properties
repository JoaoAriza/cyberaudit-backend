# ═════════════════════════════════════════════════════════════════════════════
# Compliance module — LGPD (Brazilian Law 13.709/2018) and ISO/IEC 27001:2022
# Annex A.
#
# The requirement text is a QUOTE from the law or the standard. What follows is a
# working translation, so a foreign reader understands the control — it is not
# legal text: the LGPD has no official English version, and ISO 27001 is
# published in English by ISO itself with its own wording.
# ═════════════════════════════════════════════════════════════════════════════

# ── LGPD ─────────────────────────────────────────────────────────────────────
compliance.LGPD_46.title=Security in data processing
compliance.LGPD_46.requirement=The controller and the processor shall adopt security, technical and administrative measures able to protect personal data from unauthorised access and from accidental or unlawful destruction, loss, alteration, communication or dissemination.
compliance.LGPD_46.recommendation=Deploy TLS 1.2+, redirect all traffic to HTTPS and configure the recommended HTTP security headers.

compliance.LGPD_47.title=Confidentiality by the processing agents
compliance.LGPD_47.requirement=The processing agents, or anyone else taking part in any phase of the processing, are bound to ensure information security and to keep personal data confidential.
compliance.LGPD_47.recommendation=Remove headers that disclose software versions, hide internal error messages and restrict access to API documentation.

compliance.LGPD_48.title=Reporting incidents to the national authority
compliance.LGPD_48.requirement=The controller shall report to the national authority and to the data subject any security incident that may bring relevant risk or damage to the data subjects.
compliance.LGPD_48.recommendation=Publish a security.txt file at /.well-known/security.txt with a security contact and a responsible disclosure policy.

compliance.LGPD_49.title=Security by default (Privacy by Design)
compliance.LGPD_49.requirement=Systems used to process personal data shall be structured so as to meet security requirements, good practice and governance standards, and the general principles set out in this Law.
compliance.LGPD_49.recommendation=Set the Secure, HttpOnly and SameSite=Strict flags on every session cookie. Validate and sanitise all user input.

compliance.LGPD_50.title=Good practice and data governance
compliance.LGPD_50.requirement=Controllers and processors may, within their remit, draw up rules of good practice and governance for the processing of personal data, setting out conditions of organisation and operating arrangements.
compliance.LGPD_50.recommendation=Publish SPF, DMARC (reject/quarantine policy) and CAA records in the domain DNS.

# ── ISO/IEC 27001:2022 (Annex A) ─────────────────────────────────────────────
compliance.ISO_8_7.title=Protection against malware
compliance.ISO_8_7.requirement=Protection against malware shall be implemented and supported by appropriate user awareness, with centrally managed detection and response.
compliance.ISO_8_7.recommendation=Patch every component with known CVEs. Deploy a WAF and file integrity monitoring.

compliance.ISO_8_9.title=Configuration management
compliance.ISO_8_9.requirement=Configurations, including security configurations, of hardware, software, services and networks shall be established, documented, implemented, monitored and reviewed.
compliance.ISO_8_9.recommendation=Disable unnecessary HTTP methods (PUT, DELETE, TRACE). Remove headers that disclose software versions.

compliance.ISO_8_20.title=Networks security
compliance.ISO_8_20.requirement=Networks and network devices shall be secured, managed and controlled to protect information in systems and applications.
compliance.ISO_8_20.recommendation=Close unnecessary ports at the firewall. Restrict the CORS policy to an explicit allowlist of trusted origins.

compliance.ISO_8_21.title=Security of network services
compliance.ISO_8_21.requirement=Security mechanisms, service levels and service requirements of network services shall be identified, implemented and monitored.
compliance.ISO_8_21.recommendation=Disable TLS 1.0/1.1 and weak cipher suites. Keep only TLS 1.2 and 1.3 with AEAD ciphers.

compliance.ISO_8_23.title=Web filtering
compliance.ISO_8_23.requirement=Access to external websites shall be managed to reduce exposure to malicious content.
compliance.ISO_8_23.recommendation=Validate the Host header on the server side. Block CR/LF injection and sanitise redirect parameters.

compliance.ISO_8_24.title=Use of cryptography
compliance.ISO_8_24.requirement=Rules for the effective use of cryptography, including cryptographic key management, shall be defined and implemented.
compliance.ISO_8_24.recommendation=Force HTTPS across the whole application. Deploy HSTS with a max-age of at least one year, plus preload.

compliance.ISO_8_25.title=Secure development life cycle
compliance.ISO_8_25.requirement=Rules for the secure development of software and systems shall be established and applied.
compliance.ISO_8_25.recommendation=Disable GraphQL introspection in production. Put API documentation behind authentication. Do not ship source maps.

compliance.ISO_8_28.title=Secure coding
compliance.ISO_8_28.requirement=Secure coding principles shall be applied to software development.
compliance.ISO_8_28.recommendation=Validate input at every layer. Use prepared statements for SQL. Deploy a Content Security Policy.

compliance.ISO_5_23.title=Information security for use of cloud services
compliance.ISO_5_23.requirement=Processes for acquisition, use, management and exit from cloud services shall be established in line with information security requirements.
compliance.ISO_5_23.recommendation=Remove or correctly repoint DNS records of discontinued cloud services. Monitor certificate issuance through CT logs.

compliance.ISO_5_8.title=Information security in project management
compliance.ISO_5_8.requirement=Information security shall be integrated into project management.
compliance.ISO_5_8.recommendation=Use asymmetric algorithms (RS256/ES256) in JWTs. Set a short expiry and validate issuer and audience.

