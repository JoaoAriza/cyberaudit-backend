# Security finding catalogue — English.
#
# Mirrors messages.properties (pt-BR), which is also the fallback: any key missing
# here resolves to the Portuguese one. That is deliberate — a half-translated
# report is still readable, whereas an empty string is not.
#
# WATCH the apostrophe: a message WITH parameters goes through MessageFormat,
# where `'` is an escape and must be doubled (''). A message without parameters is
# returned as-is. See issue.JWT.title below.
#
# Not translated, and not translatable from here: the impact text of
# DANGEROUS_HTTP_METHOD, JWT, API_DOCS and CVE. Those arrive already written from
# the service that produced the finding, or from the NVD.
#
# DNS_EMAIL_SPOOFING used to be on that list. Its impact still comes from
# DnsSecurityService, but the service now resolves it here — see the
# desc.DNS_SPOOFING_* keys near the bottom.

# ── SSL / TLS ────────────────────────────────────────────────────────────────
issue.NO_HTTPS_SUPPORT.title=HTTPS not supported
issue.NO_HTTPS_SUPPORT.impact=Traffic travels in plaintext — trivial to intercept.
issue.NO_HTTPS_SUPPORT.recommendation=Enable HTTPS with a valid certificate (e.g. Let's Encrypt).

issue.SSL_INVALID.title=Invalid SSL certificate
issue.SSL_INVALID.impact=Visitors get a security warning; the connection may be insecure.
issue.SSL_INVALID.recommendation=Renew the certificate and configure the intermediate chain correctly.

issue.SSL_EXPIRED.title=SSL certificate expired
issue.SSL_EXPIRED.impact=Browsers block the site or warn the visitor.
issue.SSL_EXPIRED.recommendation=Renew the certificate immediately.

issue.SSL_EXPIRING_SOON.title=Certificate close to expiry
issue.SSL_EXPIRING_SOON.impact={0} day(s) left. Automatic renewal should already have run by now — most likely it is failing.
issue.SSL_EXPIRING_SOON.recommendation=Check the certbot/ACME client and its renewal logs.

issue.WEAK_TLS_PROTOCOL.title=Deprecated TLS protocol: {0}
issue.WEAK_TLS_PROTOCOL.impact=TLS 1.0/1.1 are deprecated by RFC 8996 — vulnerable to POODLE and BEAST.
issue.WEAK_TLS_PROTOCOL.recommendation=Disable TLS 1.0 and 1.1 on the server. Require TLS 1.2 as a minimum.

issue.HTTP_NOT_REDIRECTING.title=HTTP does not redirect to HTTPS
issue.HTTP_NOT_REDIRECTING.impact=Visitors typing http:// browse without encryption.
issue.HTTP_NOT_REDIRECTING.recommendation=Configure a 301 redirect from HTTP to HTTPS and enable HSTS.

# ── Headers ──────────────────────────────────────────────────────────────────
issue.HEADERS_UNVERIFIED.title=Security headers not verified
issue.HEADERS_UNVERIFIED.impact=The page did not respond, so no security header could be evaluated. This result is partial and does not confirm any protection is in place.
issue.HEADERS_UNVERIFIED.recommendation=Check that the site is reachable (DNS, firewall, availability) and run the scan again.

issue.SERVER_VERSION_EXPOSED.title=Software version exposed in Server or X-Powered-By
issue.SERVER_VERSION_EXPOSED.impact=Makes fingerprinting and known-CVE lookup easier.
issue.SERVER_VERSION_EXPOSED.recommendation=Remove or obscure the Server and X-Powered-By headers.

issue.HSTS_MISSING.title=Strict-Transport-Security missing
issue.HSTS_MISSING.impact=Downgrade attacks to HTTP are possible.
issue.HSTS_MISSING.recommendation=Add: Strict-Transport-Security: max-age=31536000; includeSubDomains

issue.HSTS_WEAK.title=Weak Strict-Transport-Security
issue.HSTS_WEAK.impact=An incomplete configuration reduces the protection.
issue.HSTS_WEAK.recommendation=Ensure max-age >= 2592000 and consider includeSubDomains.

issue.CONTENT_TYPE_MISSING.title=X-Content-Type-Options missing
issue.CONTENT_TYPE_MISSING.impact=May allow MIME sniffing.
issue.CONTENT_TYPE_MISSING.recommendation=Add: X-Content-Type-Options: nosniff

issue.CSP_MISSING.title=Content-Security-Policy missing
issue.CSP_MISSING.impact=No barrier against injection of external scripts.
issue.CSP_MISSING.recommendation=Implement a CSP with default-src 'self' as the baseline.

issue.CSP_WEAK.title=Weak Content-Security-Policy
issue.CSP_WEAK.impact=unsafe-inline or unsafe-eval cancel out the protection against XSS.
issue.CSP_WEAK.recommendation=Remove 'unsafe-inline' and 'unsafe-eval'. Use nonces or hashes.

issue.XFRAME_MISSING.title=X-Frame-Options missing
issue.XFRAME_MISSING.impact=The site can be embedded in iframes — clickjacking risk.
issue.XFRAME_MISSING.recommendation=Add X-Frame-Options: DENY, or use frame-ancestors in the CSP.

issue.REFERRER_POLICY_MISSING.title=Referrer-Policy missing
issue.REFERRER_POLICY_MISSING.impact=Internal URLs can leak to external sites through the Referer header.
issue.REFERRER_POLICY_MISSING.recommendation=Add: Referrer-Policy: strict-origin-when-cross-origin

issue.REFERRER_POLICY_WEAK.title=Insecure Referrer-Policy
issue.REFERRER_POLICY_WEAK.impact=unsafe-url leaks full URLs including query strings.
issue.REFERRER_POLICY_WEAK.recommendation=Use strict-origin-when-cross-origin or no-referrer.

issue.PERMISSIONS_POLICY_MISSING.title=Permissions-Policy missing
issue.PERMISSIONS_POLICY_MISSING.impact=No restriction on browser APIs (camera, microphone, geolocation).
issue.PERMISSIONS_POLICY_MISSING.recommendation=Add a Permissions-Policy restricting unused features.

# ── CORS ─────────────────────────────────────────────────────────────────────
issue.CORS_REFLECTION_WITH_CREDENTIALS.title=CORS reflects origin with credentials enabled
issue.CORS_REFLECTION_WITH_CREDENTIALS.impact=Any site can make authenticated cross-origin requests on behalf of the user.
issue.CORS_REFLECTION_WITH_CREDENTIALS.recommendation=Use a strict origin allowlist. Never combine reflection with ACAC: true.

issue.CORS_ORIGIN_REFLECTION.title=CORS reflects the request Origin
issue.CORS_ORIGIN_REFLECTION.impact=Any site can reach resources as an authorised origin.
issue.CORS_ORIGIN_REFLECTION.recommendation=Use a strict allowlist instead of mirroring the Origin header.

issue.CORS_WILDCARD_CREDENTIALS.title=ACAO: * with ACAC: true — invalid configuration
issue.CORS_WILDCARD_CREDENTIALS.impact=Browsers reject it, but it signals CORS with no control in place.
issue.CORS_WILDCARD_CREDENTIALS.recommendation=Use explicit origins. Never combine a wildcard with credentials.

issue.CORS_NULL_ORIGIN.title=Accepts null origin
issue.CORS_NULL_ORIGIN.impact=Access from a sandboxed iframe or file:// — an exfiltration vector.
issue.CORS_NULL_ORIGIN.recommendation=Do not include 'null' in the origin allowlist.

# ── Cookies and injection ────────────────────────────────────────────────────
issue.INSECURE_COOKIES.title={0} cookie(s) with security problems
issue.INSECURE_COOKIES.impact=Without Secure/HttpOnly/SameSite: session theft through XSS or insecure networks becomes easy.
issue.INSECURE_COOKIES.recommendation=Add Secure, HttpOnly and SameSite=Lax to every session cookie.

issue.DB_ERROR_LEAKAGE_SUSPECTED.title=Possible database error disclosure
issue.DB_ERROR_LEAKAGE_SUSPECTED.impact=Error messages reveal the database structure.
issue.DB_ERROR_LEAKAGE_SUSPECTED.recommendation=Return generic messages in production. Log errors on the server only.

issue.REFLECTED_XSS_SUSPECTED.title=Suspected reflected XSS
issue.REFLECTED_XSS_SUSPECTED.impact=Input appears to be reflected into the page without escaping.
issue.REFLECTED_XSS_SUSPECTED.recommendation=Output encoding, input validation and a restrictive CSP.

# ── Content exposure ─────────────────────────────────────────────────────────
issue.SENSITIVE_ROBOTS_PATHS.title={0} sensitive path(s) in robots.txt
issue.SENSITIVE_ROBOTS_PATHS.impact=robots.txt doubles as a map of the internal structure for attackers.
issue.SENSITIVE_ROBOTS_PATHS.recommendation=Do not use robots.txt to hide paths. Use proper authentication.

issue.SENSITIVE_FILE_EXPOSED.title=Sensitive file reachable: {0}
issue.SENSITIVE_FILE_EXPOSED.impact=Direct exposure of configuration or credentials.
issue.SENSITIVE_FILE_EXPOSED.recommendation=Remove public access immediately. Check whether the credentials were compromised.

issue.DIRECTORY_LISTING.title=Directory listing enabled: {0}
issue.DIRECTORY_LISTING.impact=Exposing the file structure eases reconnaissance and access to sensitive files.
issue.DIRECTORY_LISTING.recommendation=Disable directory listing on the web server (Options -Indexes on Apache, autoindex off on Nginx).

issue.DANGEROUS_HTTP_METHOD.title=Dangerous HTTP method enabled: {0}
issue.DANGEROUS_HTTP_METHOD.recommendation=Disable HTTP methods the application does not need.

issue.SECURITY_TXT_MISSING.title=security.txt missing (RFC 9116)
issue.SECURITY_TXT_MISSING.impact=Makes responsible vulnerability disclosure harder.
issue.SECURITY_TXT_MISSING.recommendation=Create /.well-known/security.txt with a Contact field.

issue.OPEN_REDIRECT.title=Open redirect detected
issue.OPEN_REDIRECT.impact=Attackers can use your domain as a stepping stone in phishing campaigns.
issue.OPEN_REDIRECT.recommendation=Validate and sanitise every redirect parameter. Use a destination allowlist.

# ── DNS and edge ─────────────────────────────────────────────────────────────
issue.DNS_EMAIL_SPOOFING.title=Email spoofing risk: {0}
issue.DNS_EMAIL_SPOOFING.recommendation=Configure SPF with -all, DMARC with p=reject, and DKIM on every active selector.

issue.NO_WAF_DETECTED.title=No WAF (Web Application Firewall) detected
issue.NO_WAF_DETECTED.impact=Without a WAF, attacks such as SQLi, XSS and brute force reach the application server directly.
issue.NO_WAF_DETECTED.recommendation=Consider adding Cloudflare, AWS WAF or similar as a protection layer.

# ── CVE ──────────────────────────────────────────────────────────────────────
issue.CVE.title=[Potential] {0} — {1} (CVSS {2})
issue.CVE.recommendation=Confirm the exact version of {0} before acting — detection is based on the version reported in the banner and may be a false positive if the vendor or distro backported the fix without changing the version number. If confirmed, upgrade to an unaffected version.
issue.CVE.reference=\ Ref: {0}

# ── JWT ──────────────────────────────────────────────────────────────────────
issue.JWT.title=Insecure JWT in ''{0}'' (alg={1})
issue.JWT.recommendation=Use an asymmetric algorithm (RS256/ES256), add exp/iss/aud claims, and never use alg=none in production.

# ── GraphQL ──────────────────────────────────────────────────────────────────
issue.GRAPHQL_PLAYGROUND.title=Public GraphQL playground at {0}{1}
issue.GRAPHQL_PLAYGROUND.impact=An interactive GraphQL interface reachable without authentication — it allows exploring and running queries against the API.
issue.GRAPHQL_INTROSPECTION.title=GraphQL introspection enabled at {0}{1}
issue.GRAPHQL_INTROSPECTION.impact=Introspection enabled in production — exposes the full schema: queries, mutations, types and fields.
issue.GRAPHQL.recommendation=Disable introspection in production (e.g. spring.graphql.schema.introspection.enabled=false). Restrict playground access to development environments.
issue.GRAPHQL.typeCount=\ ({0} types in the schema)

# ── API documentation ────────────────────────────────────────────────────────
issue.API_DOCS.title=API documentation exposed: {0}
issue.API_DOCS.recommendation=Restrict access to API documentation in production behind authentication, or remove the /swagger-ui, /api-docs and /openapi.json endpoints.

