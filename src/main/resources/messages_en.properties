# ═════════════════════════════════════════════════════════════════════════════
# Port module — impact and recommendation per open port.
# ═════════════════════════════════════════════════════════════════════════════
issue.PORT_21.impact=FTP exposed: credentials travel in plaintext; allows file enumeration and exfiltration.
issue.PORT_21.recommendation=Turn FTP off. Use SFTP (port 22) or FTPS. Restrict it behind a firewall or VPN.
issue.PORT_22.impact=Exposed SSH widens the attack surface (bruteforce, weak credentials, version exploits).
issue.PORT_22.recommendation=Use key-based authentication (disable passwords). Restrict source IPs at the firewall. Enable fail2ban.
issue.PORT_23.impact=TELNET: no encryption at all. Credentials and data travel in plaintext over the network.
issue.PORT_23.recommendation=Turn TELNET off right away. Replace it with SSH. Block it at the firewall.
issue.PORT_25.impact=An open SMTP port can be abused for spam relay or user enumeration (VRFY/EXPN).
issue.PORT_25.recommendation=Restrict relaying. Require authentication. Block the port unless this host is a mail server.
issue.PORT_53.impact=Exposed DNS allows record enumeration and can be abused in amplification attacks.
issue.PORT_1433.impact=MS SQL Server exposed: risk of unauthorised access, arbitrary queries and data exfiltration.
issue.PORT_1521.impact=Oracle DB exposed: unauthorised access to critical data and possible RCE through procedures.
issue.PORT_3306.impact=MySQL exposed: direct database access with no application layer in front of it.
issue.PORT_5432.impact=PostgreSQL exposed: unauthorised data access and possible RCE through extensions.
issue.PORT_BANCO.recommendation=Never expose a database to the internet. Restrict it to internal IPs or a VPN. Require strong authentication and keep an audit trail.
issue.PORT_6379.impact=Redis without auth is critical: unrestricted read/write and possible RCE through CONFIG SET.
issue.PORT_6379.recommendation=Require AUTH/ACL. Bind to loopback (127.0.0.1). Put it behind a VPN. Disable dangerous commands.
issue.PORT_9200.impact=Elasticsearch exposed: indices can be read and altered, enabling bulk data exfiltration.
issue.PORT_9200.recommendation=Enable authentication (X-Pack/Security). Put it on an internal network or VPN. Never expose it publicly.
issue.PORT_80.impact=HTTP exposed; the risk depends on authentication, vulnerabilities and what the app serves.
issue.PORT_80.recommendation=Redirect to HTTPS. Put a WAF in front. Keep the app and its dependencies patched.
issue.PORT_443.impact=HTTPS exposed is expected; the risk depends on the TLS configuration and on the app.
issue.PORT_443.recommendation=Configure strong TLS (1.2+), HSTS and a valid certificate, and keep dependencies patched.
issue.PORT_OUTRA.impact=Exposing the {0} service may widen the attack surface.
issue.PORT_OUTRA.recommendation=Close it unless it is needed. If it is, restrict it by IP and require strong authentication.

