# CyberAudit — Cloudflare Tunnel.
# Destino: /etc/cloudflared/config.yml
#
# Por que Tunnel e não apenas "Cloudflare na frente":
# com proxy tradicional o servidor continua com 80/443 abertos para a internet.
# Quem descobrir o IP de origem (varredura, certificados, DNS histórico) alcança
# a aplicação direto e pode FORJAR o header X-Forwarded-For — o que zera o limite
# de 5 scans/dia por IP e o lockout de login por IP, ambos baseados nele.
# Proteger isso por firewall exige manter as faixas do Cloudflare atualizadas;
# com Tunnel não há porta aberta para forjar nada, e nada para manter.
#
# Instalar:
#   cloudflared tunnel login
#   cloudflared tunnel create cyberaudit
#   cloudflared tunnel route dns cyberaudit api.cyberauditapp.com
#   (copie este arquivo, ajuste o tunnel id, e então:)
#   cloudflared service install
#
# O <TUNNEL-ID> e o caminho do .json saem do comando `tunnel create`.

tunnel: <TUNNEL-ID>
credentials-file: /root/.cloudflared/<TUNNEL-ID>.json

ingress:
  - hostname: api.cyberauditapp.com
    # Aponta para o nginx (127.0.0.1:8080), não direto para o Spring (8081):
    # é no nginx que ficam o client_max_body_size e os timeouts longos do scan.
    service: http://127.0.0.1:8080
    originRequest:
      connectTimeout: 10s
      # Precisa acomodar o orçamento de 120s por fase do scan.
      noTLSVerify: false
      httpHostHeader: api.cyberauditapp.com

  # Regra final obrigatória: qualquer outro hostname recebe 404.
  - service: http_status:404
