# CyberAudit — nginx como proxy reverso da API.
# Destino: /etc/nginx/sites-available/cyberaudit-api  (+ symlink em sites-enabled/)
#
# Cenário: Cloudflare Tunnel. O cloudflared conecta de dentro para fora, então
# este bloco escuta APENAS em 127.0.0.1 — o droplet não expõe porta nenhuma para
# a internet e o IP de origem deixa de importar.
#
# TLS não aparece aqui de propósito: quem termina o TLS é o Cloudflare, e o
# trecho cloudflared → nginx nunca sai da máquina.
#
# Headers de segurança também não aparecem: o Spring já os envia em toda resposta
# (SecurityHeadersConfig). Repetir aqui geraria header duplicado.

server {
    listen 127.0.0.1:8080;
    server_name api.cyberauditapp.com;

    # Spring MVC não impõe teto para corpo JSON (o maxPostSize do Tomcat só vale
    # para form-urlencoded). Sem isto, um POST de centenas de MB é desserializado
    # em memória. 2 MB cobre com folga o maior payload legítimo (logo da marca).
    client_max_body_size 2m;

    # Scan ativo é lento por natureza: as duas fases têm orçamento de 120s cada.
    # Com o padrão de 60s o nginx cortaria a conexão antes de o scan terminar.
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 10s;

    # Buffer de resposta desligado: /scan/report/pdf devolve o PDF inteiro de uma vez.
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # É DESTE header que o rate-limit de guest (5 scans/dia por IP) e o
        # lockout de login dependem — o Spring o lê via FORWARD_HEADERS=framework.
        # O cloudflared já preenche com o IP real do visitante.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }

    # O actuator fica acessível só de dentro da máquina. /actuator/health é
    # público na aplicação (para o healthcheck do container), mas não há motivo
    # para expô-lo na internet.
    location /actuator/ {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}
