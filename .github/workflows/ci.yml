name: CI

# Roda os testes (e valida o empacotamento + build-info) a cada push na main e em
# todo PR. Num produto de segurança, "passou no teste" só vale se o teste roda
# sempre — não só quando alguém lembra de rodar local.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test & build (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # verify (e não test) de propósito: roda a suíte E o empacotamento do jar,
      # incluindo o goal build-info. Os testes de contexto usam o perfil `test`
      # (H2 em memória, jwt.secret fixo) — sem Postgres, SMTP ou rede.
      - name: Build & test
        run: mvn -B --no-transfer-progress verify
